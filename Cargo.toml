[package]
name = "isolite"
version = "0.4.0"
edition = "2021"
build = "build-support/main.rs"
description = "ISO customization in Rust std with Slint UI"

[dependencies]
slint = "=1.18.1"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
